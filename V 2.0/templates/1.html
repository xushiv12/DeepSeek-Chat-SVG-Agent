
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Pixel Image Generation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    .hero {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #000;
      padding: 24px;
    }

    .hero-content {
      max-width: 1100px;
    }

    .hero-title {
      font-size: clamp(38px, 6vw, 78px);
      font-weight: 600;
      line-height: 1.12;
      color: #ffffff;
      margin-bottom: 28px;
      letter-spacing: -0.02em;
    }

    .hero-subtitle {
      font-size: clamp(18px, 2vw, 24px);
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 42px;
    }

    .hero-button {
      display: inline-block;
      text-decoration: none;
      background: #3f6df6;
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      padding: 20px 42px;
      border-radius: 999px;
      transition: all 0.2s ease;
      box-shadow: 0 8px 24px rgba(63, 109, 246, 0.28);
    }

    .hero-button:hover {
      background: #4c78ff;
      transform: translateY(-2px);
    }

    .hero-button:active {
      transform: translateY(0);
    }

    /* 👇 新增：像素风标题效果 */
    .pixel {
      font-family: monospace;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-content">
      
      <h1 class="hero-title pixel">
        AI Pixel Image Generation
      </h1>

      <p class="hero-subtitle">
        Generate 10×10 pixel art using AI-generated structured code.  
        Convert text into color blocks and render images directly in the browser.
      </p>

      <a class="hero-button" href="/image-maker">
        Start Creating Pixels
      </a>

    </div>
  </section>
</body>
</html>
